name: Unity model source contract (offline)
on:
  pull_request:
    paths:
      - 'unity/**'
      - '.github/workflows/unity-asset-manifest.yml'
  push:
    branches:
      - feat/unity-mamoken-3d-poc
    paths:
      - 'unity/**'
      - '.github/workflows/unity-asset-manifest.yml'
permissions:
  contents: read
jobs:
  python-model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pinned source contract and GLB parser
        run: python -m unittest discover -s unity/tools/tests -p 'test_*.py' -v
